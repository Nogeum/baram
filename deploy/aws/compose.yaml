name: portal-aws
services:
  portal:
    image: ${PORTAL_IMAGE:-portal:aws-test}
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Doracle.jdbc.timezoneAsRegion=false -Duser.timezone=Asia/Seoul -XX:MaxRAMPercentage=65"
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SPRING_THYMELEAF_CACHE: "true"
      PORTAL_BOOTSTRAP_ENABLED: "false"
    expose: ["8080"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PORTAL_HOSTNAME: ${PORTAL_HOSTNAME:?Set a DNS hostname pointing to the AWS server}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [portal]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
