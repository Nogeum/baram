services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Doracle.jdbc.timezoneAsRegion=false -Duser.timezone=Asia/Seoul"
      SPRING_PROFILES_ACTIVE: oracle,oracle-local
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//host.docker.internal:1521/orcl
      SERVER_PORT: "8080"
      PORTAL_BOOTSTRAP_ENABLED: "false"
    volumes:
      - type: bind
        source: ./config/application-oracle-local.properties
        target: /app/config/application-oracle-local.properties
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 30s


