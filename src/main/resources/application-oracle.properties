# Shared Oracle 11g settings. Local credentials are kept outside the source tree.
spring.config.import=optional:file:./config/application-oracle-local.properties
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
spring.datasource.username=${ORACLE_USERNAME:PORTAL_APP}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=Oracle
spring.jpa.properties.jakarta.persistence.database-major-version=11
spring.jpa.properties.jakarta.persistence.database-minor-version=2
spring.jpa.hibernate.ddl-auto=validate
portal.bootstrap.enabled=false
